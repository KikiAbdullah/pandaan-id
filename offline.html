<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex, nofollow"><meta name="theme-color" content="#1E4030"><title>Offline — pandaan.id</title>
<!-- Mandiri (CSS inline) agar tetap bergaya saat disajikan sebagai fallback
     service worker dari URL mana pun. -->
<style>
  :root{--paper:#F5F0E6;--ink:#1F2933;--pine:#2F5D46;--pine-deep:#1E4030;--muted:#55636B}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--paper);color:var(--ink);line-height:1.6}
  main{max-width:620px;margin:0 auto;padding:4.5rem 1.25rem;text-align:center}
  .mark{display:inline-grid;place-items:center;width:64px;height:64px;border-radius:16px 16px 16px 5px;background:var(--pine);color:#fff;font-weight:800;font-size:1.4rem}
  .eyebrow{letter-spacing:.13em;text-transform:uppercase;font-size:.75rem;font-weight:800;color:var(--pine)}
  h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(2rem,6vw,2.6rem);line-height:1.05;margin:.6rem 0 0}
  p{color:var(--muted)} button{padding:.7rem 1.3rem;border:0;border-radius:999px;background:var(--pine);color:#fff;font-weight:700;cursor:pointer;font:inherit}
  button:hover{background:var(--pine-deep)}
  .skip{position:fixed;top:.75rem;left:.75rem;transform:translateY(-200%);background:var(--pine-deep);color:#fff;padding:.6rem 1rem;border-radius:.6rem}
  .skip:focus{transform:none}
</style></head><body>
  <a class="skip" href="#main-content">Lewati ke konten utama</a><main id="main-content"><div class="mark">p.</div><p class="eyebrow">Koneksi terputus</p><h1>Kamu sedang offline.</h1><p>Periksa koneksi internet, lalu coba lagi. Halaman yang tersimpan di perangkat mungkin berisi data lama — termasuk Info Jalan — jadi periksa kembali setelah tersambung.</p><button type="button" onclick="window.location.reload()">Coba lagi</button></main></body></html>
